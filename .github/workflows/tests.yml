name: Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAMERHQ_SDK_REF: 843d81e6584d2372a861d12223486bc594f16a3b

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned GamerHQ Skill SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gamerhq-skill-sdk @ git+https://github.com/Duy-Phan96/GamerHQ.git@${GAMERHQ_SDK_REF}"
      - name: Install Skill package
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.1.1
      - name: Check dependencies
        run: python -m pip check
      - name: Build release wheel
        run: |
          rm -rf dist
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = project["name"].replace("-", "_") + "-" + project["version"]
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          if not wheels[0].name.startswith(expected):
              raise SystemExit(f"unexpected wheel name: {wheels[0].name}")
          print(wheels[0].name)
          PY
      - name: Run offline tests
        run: python -m pytest
