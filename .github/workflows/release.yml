name: Publish Skill Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GAMERHQ_SDK_REF: a23821dc792a449a6d4afae453c1d7cc1723ec3f

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release tag and commit
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          version = project["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {expected!r}")

          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          main = subprocess.check_output(
              ["git", "rev-parse", "origin/main"], text=True
          ).strip()
          if head != main:
              raise SystemExit(
                  f"release tag must point at current main: tag={head}, main={main}"
              )

          print(f"verified {tag} at {head}")
          PY

      - name: Install reviewed GamerHQ Skill SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gamerhq-skill-sdk @ git+https://github.com/Duy-Phan96/GamerHQ.git@${GAMERHQ_SDK_REF}"

      - name: Build release wheel
        run: |
          rm -rf dist
          python -m pip wheel --no-deps . --wheel-dir dist

      - name: Smoke test release wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import entry_points, version

          installed = version("gamerhq-skill-recurring-posts")
          eps = [
              ep
              for ep in entry_points(group="gamerhq.skills")
              if ep.name == "recurring-posts"
          ]
          if len(eps) != 1:
              raise SystemExit(f"expected one recurring-posts entry point, found {len(eps)}")
          skill = eps[0].load()()
          if skill.manifest.id != "recurring-posts":
              raise SystemExit(f"unexpected Skill ID: {skill.manifest.id}")
          if skill.manifest.version != installed:
              raise SystemExit(
                  f"manifest/package version mismatch: {skill.manifest.version} != {installed}"
              )
          print(f"{skill.manifest.id} {installed}")
          PY

      - name: Generate release notes and checksums
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          version = tomllib.loads(
              (root / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version}\n"
          start = changelog.find(marker)
          if start < 0:
              raise SystemExit(f"CHANGELOG section missing for {version}")
          body_start = start + len(marker)
          next_section = changelog.find("\n## ", body_start)
          body = changelog[body_start: next_section if next_section >= 0 else None].strip()
          if not body:
              raise SystemExit(f"CHANGELOG section for {version} is empty")

          notes = (
              f"# Recurring Posts {version}\n\n"
              f"{body}\n\n"
              "## Compatibility\n\n"
              "- Runtime API: 1\n"
              "- GamerHQ Skill SDK: >=0.2,<0.3\n"
              "- Storage migration: none\n"
              "- Capabilities: unchanged\n"
          )
          (root / "release-notes.md").write_text(notes, encoding="utf-8")
          PY
          sha256sum dist/*.whl > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             dist/*.whl             dist/SHA256SUMS.txt             --repo "${GITHUB_REPOSITORY}"             --title "${GITHUB_REF_NAME}"             --notes-file release-notes.md             --verify-tag
