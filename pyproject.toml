[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gamerhq-skill-recurring-posts"
version = "1.3.2"
description = "Recurring Posts Skill for GamerHQ-compatible hosts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "GamerHQ"}]
keywords = ["discord", "automation", "scheduler", "plugins", "skills", "gamerhq"]

[project.urls]
Homepage = "https://github.com/Duy-Phan96/gamerhq-skill-recurring-posts"
Repository = "https://github.com/Duy-Phan96/gamerhq-skill-recurring-posts"
Issues = "https://github.com/Duy-Phan96/gamerhq-skill-recurring-posts/issues"
Changelog = "https://github.com/Duy-Phan96/gamerhq-skill-recurring-posts/blob/main/CHANGELOG.md"

[project.entry-points."gamerhq.skills"]
recurring-posts = "gamerhq_skill_recurring_posts:create_skill"

[tool.setuptools]
packages = ["gamerhq_skill_recurring_posts"]

[tool.gamerhq]
skill-id = "recurring-posts"
runtime-api = "1"
sdk = ">=0.1,<0.2"
capabilities = [
  "discord.channels.read",
  "discord.messages.send",
  "scheduler.jobs",
  "storage.skill",
  "events.emit",
  "audit.write",
]
